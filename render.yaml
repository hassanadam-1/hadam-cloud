services:
  - type: web
    name: hadam-cloud
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HADAM_AUTH_DRIVER
        value: supabase
      - key: HADAM_BASE_DOMAIN
        sync: false
      # The four below are secrets — Render will prompt you to enter
      # each one manually in its dashboard rather than storing the
      # actual values in this file (which is committed to the repo).
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
