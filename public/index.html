<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadam Store &amp; Marketplace</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f5a623">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="#" class="logo" id="storeLogo" onclick="go('welcome');return false;" style="display:flex;align-items:center;gap:8px;"><img src="/assets/logo/hadam-icon-light.svg" alt="" style="width:30px;height:30px;flex-shrink:0;" aria-hidden="true"><span id="storeLogoText">HADAM <span class="dot">●</span></span></a>
    <nav class="main-nav" id="mainNav"></nav>
    <a href="#" id="staticHelpLink" target="_blank" rel="noopener" style="font-size:14px;font-weight:500;color:var(--text-dim);padding:7px 12px;border-radius:8px;">Help</a>
    <script>
      // Deliberately simple and self-contained — independent of app.js's
      // boot() sequence, so this link works even if that sequence has
      // trouble for any reason. Sets the href to the platform site's Help
      // page based on the current subdomain, with no other dependencies.
      (function () {
        var parts = window.location.host.split('.');
        var platformHost = parts.length > 1 ? parts.slice(1).join('.') : parts[0];
        document.getElementById('staticHelpLink').href = window.location.protocol + '//' + platformHost + '#help';
      })();
    </script>
    <div class="topbar-actions">
      <select id="langSelect" class="btn ghost sm" onchange="setLang(this.value)" style="cursor:pointer;">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="fr">Français</option>
      </select>
      <button class="btn secondary sm" id="cartBtn" onclick="state.checkoutStep='cart';go('cart')" style="display:none">Cart <span class="badge" id="cartBadge">0</span></button>
      <button class="btn secondary sm" id="authBtn" onclick="onAuthBtn()">Log in</button>
    </div>
  </div>
</header>

<main>
  <section class="view active" id="view-welcome">
    <div id="welcomeContent"></div>
  </section>

  <section class="view" id="view-home">
    <div id="saleOnHadamBanner" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <span id="saleOnHadamBlurb" style="font-size:13.5px;color:var(--text-dim);">Looking for more? Browse every store on Hadam's shared Marketplace.</span>
      <a id="saleOnHadamLink" href="#" target="_blank" class="btn secondary sm">Sale on Hadam →</a>
    </div>
    <h2 class="section-title" id="catalogTitle">Browse</h2>
    <div class="filters" id="groupFilters"></div>
    <div class="filters" id="catFilters"></div>
    <div class="grid" id="productGrid"></div>
  </section>

  <section class="view" id="view-product"><div id="productDetail"></div></section>
  <section class="view" id="view-cart"><div id="cartContent"></div></section>
  <section class="view" id="view-stores"><div id="storesContent"></div></section>
  <section class="view" id="view-orders"><div id="ordersContent"></div></section>
  <section class="view" id="view-employee"><div id="employeeContent"></div></section>
  <section class="view" id="view-admin"><div id="adminContent"></div></section>
  <section class="view" id="view-sell"><div id="sellContent"></div></section>
</main>

<footer id="storeFooter" style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;"><img src="/assets/logo/hadam-icon-light.svg" alt="" style="width:26px;height:26px;flex-shrink:0;" aria-hidden="true"><span id="storeFooterText">Powered by Hadam — the global digital store and multi-tenant marketplace platform. © 2026 Hadam. All rights reserved.</span></footer>

<div class="modal-overlay" id="authOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('authOverlay')">✕</button>
    <div id="authModalContent"></div>
  </div>
</div>

<div class="modal-overlay" id="genericOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('genericOverlay')">✕</button>
    <div id="genericModalContent"></div>
  </div>
</div>

<div class="modal-overlay" id="accountOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('accountOverlay')">✕</button>
    <div id="accountModalContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/app.js"></script>
</body>
</html>
